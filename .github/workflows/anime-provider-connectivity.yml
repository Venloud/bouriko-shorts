name: Anime Provider Connectivity Test
on:
  push:
    paths:
      - .github/workflows/anime-provider-connectivity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  providers:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/anime-motion-kokoro
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose API DNS and HTTP
        run: python experiments/diagnose_anime_providers.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: anime-provider-diagnostics
          path: output/clip_pull_test/provider_diagnostics.json
          if-no-files-found: warn
