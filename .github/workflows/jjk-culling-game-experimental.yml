name: JJK Culling Game Experimental Render
# Manual only. Never publishes. Runs the branch you dispatch it on (Actions > Run workflow > branch).
# V4: the owner-approved Young Jamal mp3 is used as-is (0 ElevenLabs credits); word timings come
# from the committed forced alignment (experiments/jjk/v4_alignment.json).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q requests numpy pillow
      - name: Script V4 + visual plan + fact ledger
        run: python experiments/jjk/jjk_story.py
      - name: Supplied narration (as-is) + forced-alignment word timings
        run: python experiments/jjk/import_audio.py
      - name: JJK media director (characters + references, media plan)
        run: python experiments/jjk/prepare_jjk_media.py
      - name: Apply visual plan
        run: python pipeline/visual_plan.py --strict
      - name: SFX (hits/whooshes on reveals, never on a word)
        run: python pipeline/sfx.py
      - name: Prepare Remotion props (beats, captions, music bed, mastering)
        run: python pipeline/remotion_prepare.py
      - name: Render
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npm run render
      - name: QA (+ 10 review frames)
        run: python pipeline/qa.py --frames 10
      - name: Upload review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jjk-culling-game-review
          path: |
            output/bouriko.mp4
            output/frames/
            output/story.json
            output/fact_ledger.json
            output/jjk_media_plan.json
            output/jjk_media_plan.md
            output/jjk_images/
            output/voice_report.json
            output/beats.json
            output/word_timings.json
          if-no-files-found: warn
