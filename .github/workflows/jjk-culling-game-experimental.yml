name: JJK Culling Game Experimental Render
# Manual only. Never publishes. Runs the branch you dispatch it on (Actions > Run workflow > branch).
on:
  workflow_dispatch:
    inputs:
      stage:
        description: "full = test line then full render; voice_test = only the 10-15 s name test"
        type: choice
        options: [full, voice_test]
        default: full
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q requests numpy pillow
      - name: Restore ElevenLabs audio cache
        uses: actions/cache/restore@v4
        with:
          path: cache/tts
          key: jjk-tts-${{ github.run_id }}
          restore-keys: jjk-tts-
      - name: Fact-locked JJK story (script v2) + fact ledger
        run: python experiments/jjk/jjk_story.py
      - name: ElevenLabs 10-15 s name test (Kogane, Kenjaku, Megumi, Tsumiki, Yuji, Tengen, shikigami)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          BOURIKO_ELEVENLABS_API_KEY: ${{ secrets.BOURIKO_ELEVENLABS_API_KEY }}
        run: python experiments/jjk/voice_test.py
      - name: JJK media director (character images + media plan, replaces pipeline/media.py)
        if: ${{ inputs.stage != 'voice_test' }}
        run: python experiments/jjk/prepare_jjk_media.py
      - name: Apply visual plan
        if: ${{ inputs.stage != 'voice_test' }}
        run: python pipeline/visual_plan.py --strict
      - name: Narration (ElevenLabs eleven_v4, no fallback)
        if: ${{ inputs.stage != 'voice_test' }}
        env:
          BOURIKO_ELEVENLABS_API_KEY: ${{ secrets.BOURIKO_ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python pipeline/voice.py
      - name: Save ElevenLabs audio cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: cache/tts
          key: jjk-tts-${{ github.run_id }}
      - name: SFX
        if: ${{ inputs.stage != 'voice_test' }}
        run: python pipeline/sfx.py
      - name: Prepare Remotion props (beats, captions, mastering)
        if: ${{ inputs.stage != 'voice_test' }}
        run: python pipeline/remotion_prepare.py
      - name: Render
        if: ${{ inputs.stage != 'voice_test' }}
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npm run render
      - name: QA (+ 8 review frames)
        if: ${{ inputs.stage != 'voice_test' }}
        run: python pipeline/qa.py --frames 8
      - name: Upload review artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: jjk-culling-game-review
          path: |
            output/bouriko.mp4
            output/frames/
            output/story.json
            output/fact_ledger.json
            output/jjk_media_plan.json
            output/jjk_media_plan.md
            output/jjk_images/
            output/voice_report.json
            output/beats.json
            output/word_timings.json
            output/voice_test/voice_test.mp3
            output/voice_test/report.json
          if-no-files-found: warn
