name: JJK Culling Game Experimental Render
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/jjk-culling-game-experimental.yml']
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out isolated experimental branch
        uses: actions/checkout@v4
        with:
          ref: experiment/anime-motion-kokoro
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q requests google-api-python-client google-auth "kokoro>=0.9.4" soundfile numpy pillow google-genai yt-dlp
      - name: Prepare JJK Culling Game story
        run: python experiments/jjk_story.py
      - name: Prepare verified JJK episode clips
        run: python experiments/prepare_verified_clips.py
      - name: Generate Kokoro narration
        run: python pipeline/voice.py
      - name: Generate SFX
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/sfx.py
      - name: Prepare Remotion scenes
        run: python pipeline/remotion_prepare.py
      - name: Render video
        working-directory: remotion
        run: |
          npm install --no-audit --no-fund
          npm run render
      - name: Run video QA
        run: python pipeline/qa.py
      - name: Upload review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jjk-culling-game-experimental-review
          path: |
            output/bouriko.mp4
            output/story.json
            output/media_manifest.json
            output/word_timings.json
            output/scene_matches.json
          if-no-files-found: warn
