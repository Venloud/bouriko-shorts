name: Blitz AnimeParadise Decode Test
# Retrigger isolated decode probe, 2026-10-08
on:
  push:
    branches: [experiment/anime-motion-kokoro]
    paths:
      - 'experiments/blitz_decode_test.py'
      - '.github/workflows/blitz-decode-test.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  decode:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg and verify
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          command -v ffmpeg
          ffmpeg -version | head -1
      - name: Install Blitz
        run: |
          git clone --depth 1 https://github.com/blitzlabx/blitz-anime-api.git /tmp/blitz-api
          cd /tmp/blitz-api
          npm install --no-audit --no-fund
      - name: Start Blitz API
        run: |
          cd /tmp/blitz-api
          nohup npm start > /tmp/blitz.log 2>&1 &
      - name: Decode a short JJK sample without saving footage
        run: python experiments/blitz_decode_test.py
      - name: Upload diagnostic JSON and review-only preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blitz-decode-diagnostics
          path: |
            output/blitz_decode_results.json
            output/blitz_jjk_preview.mp4
      - name: Publish sanitized diagnostic issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          path = Path("output/blitz_decode_results.json")
          if not path.exists():
              print("No JSON diagnostic generated")
              raise SystemExit(0)
          result = json.loads(path.read_text())
          # Do not post any URLs, headers, media or raw provider responses.
          safe = {
              "passed": result.get("passed"),
              "provider": result.get("provider"),
              "steps": result.get("steps"),
              "error": result.get("error"),
          }
          title = "Blitz decode probe diagnostics (experimental)"
          body = "Automated diagnostic from isolated Bouriko experiment.\\n\\nRun: " + os.environ["RUN_URL"] + "\\n\\n```json\\n" + json.dumps(safe, indent=2)[:8000] + "\\n```"
          existing = subprocess.run(["gh", "issue", "list", "--state", "open", "--search", title + " in:title", "--json", "number,title"], capture_output=True, text=True, check=True)
          matches = [x for x in json.loads(existing.stdout) if x["title"] == title]
          if matches:
              subprocess.run(["gh", "issue", "comment", str(matches[0]["number"]), "--body", body], check=True)
          else:
              subprocess.run(["gh", "issue", "create", "--title", title, "--body", body], check=True)
          PY
