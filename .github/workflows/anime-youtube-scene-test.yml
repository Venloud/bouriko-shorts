name: Anime YouTube Scene Retrieval Test
on:
  push:
    branches: [main]
    paths: ['.github/workflows/anime-youtube-scene-test.yml']
  workflow_dispatch:
    inputs:
      query:
        description: YouTube search query
        required: false
        type: string
        default: ''
      script:
        description: Story or narration used to find relevant footage
        required: false
        type: string
        default: 'Jujutsu Kaisen Culling Game: Yuji Itadori and Megumi Fushiguro enter the deadly Culling Game.'
      url:
        description: Optional exact YouTube video URL
        required: false
        type: string
        default: ''
      start:
        description: Start second in source trailer
        required: true
        type: string
        default: '10'
      duration:
        description: Clip duration (0.5-20 seconds)
        required: true
        type: string
        default: '5'
      authorized_mp4_url:
        description: Optional authorized HTTPS MP4 fallback URL
        required: false
        type: string
        default: ''
      diagnose:
        description: Run verbose IPv4 YouTube access probe
        required: false
        type: boolean
        default: true
      search_only:
        description: Discover videos without downloading
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  youtube-scene-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout experimental implementation
        uses: actions/checkout@v4
        with:
          ref: experiment/anime-motion-kokoro
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install downloader and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade 'yt-dlp[default]' 'bgutil-ytdlp-pot-provider==2.0.2'
          git clone --depth 1 --branch 2.0.2 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git "$HOME/bgutil-ytdlp-pot-provider"
          (cd "$HOME/bgutil-ytdlp-pot-provider/server" && npm ci && npx tsc)
          yt-dlp --verbose --version
          if ! command -v deno >/dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
            echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          fi
      - name: Discover and extract official trailer footage
        env:
          QUERY: ${{ inputs.query }}
          SCRIPT: "${{ inputs.script || 'Jujutsu Kaisen Culling Game: Yuji Itadori and Megumi Fushiguro enter the deadly Culling Game.' }}"
          URL: ${{ inputs.url }}
          START: ${{ inputs.start || '10' }}
          DURATION: ${{ inputs.duration || '5' }}
          SEARCH_ONLY: ${{ inputs.search_only }}
          AUTHORIZED_MP4_URL: ${{ inputs.authorized_mp4_url }}
          DIAGNOSE: ${{ inputs.diagnose || 'true' }}
        run: |
          python -m py_compile experiments/test_youtube_anime_scene.py
          args=(--script "$SCRIPT" --start "$START" --duration "$DURATION")
          [[ -n "$QUERY" ]] && args+=(--query "$QUERY")
          [[ -n "$URL" ]] && args+=(--url "$URL")
          [[ "$SEARCH_ONLY" == "true" ]] && args+=(--search-only)
          [[ "$DIAGNOSE" == "true" ]] && args+=(--diagnose)
          [[ -n "$AUTHORIZED_MP4_URL" ]] && args+=(--authorized-mp4-url "$AUTHORIZED_MP4_URL")
          python experiments/test_youtube_anime_scene.py "${args[@]}"
      - name: Upload extracted anime scene and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-anime-scene-test
          path: |
            output/youtube_scene_test/report.json
            output/youtube_scene_test/anime_scene_clip.mp4
          if-no-files-found: warn

  cobalt-api-probe:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Start self-hosted Cobalt
        run: |
          docker run -d --name cobalt-test -p 127.0.0.1:9000:9000 -e API_URL=http://127.0.0.1:9000/ ghcr.io/imputnet/cobalt:11
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9000/ > /tmp/cobalt-info.json; then cat /tmp/cobalt-info.json; break; fi
            sleep 2
          done
      - name: Probe Cobalt API with JJK trailer
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, socket
          video = "https://www.youtube.com/watch?v=t4_PZR2xAtc"
          for base in ("http://127.0.0.1:9000",):
              print("TESTING", base, flush=True)
              try:
                  req = urllib.request.Request(base.rstrip("/")+"/", data=json.dumps({"url":video,"videoQuality":"720","youtubeVideoContainer":"mp4"}).encode(), headers={"Accept":"application/json","Content-Type":"application/json","User-Agent":"Bouriko-Cobalt-Probe/1.0"}, method="POST")
                  with urllib.request.urlopen(req, timeout=25) as resp:
                      payload = resp.read(4096).decode(errors="replace")
                      print("HTTP", resp.status, "BODY", payload[:1800], flush=True)
              except urllib.error.HTTPError as e:
                  print("HTTP", e.code, "BODY", e.read(1800).decode(errors="replace"), flush=True)
              except Exception as e:
                  print("ERROR", type(e).__name__, str(e), flush=True)
          PY
          docker logs --tail 80 cobalt-test
