name: Anime YouTube Scene Retrieval Test
on:
  workflow_dispatch:
    inputs:
      query:
        description: YouTube search query
        required: false
        type: string
        default: ''
      script:
        description: Story or narration used to find relevant footage
        required: false
        type: string
        default: 'Jujutsu Kaisen Culling Game: Yuji Itadori and Megumi Fushiguro enter the deadly Culling Game.'
      url:
        description: Optional exact YouTube video URL
        required: false
        type: string
        default: ''
      start:
        description: Start second in source trailer
        required: true
        type: string
        default: '10'
      duration:
        description: Clip duration (0.5-20 seconds)
        required: true
        type: string
        default: '5'
      authorized_mp4_url:
        description: Optional authorized HTTPS MP4 fallback URL
        required: false
        type: string
        default: ''
      diagnose:
        description: Run verbose IPv4 YouTube access probe
        required: false
        type: boolean
        default: true
      search_only:
        description: Discover videos without downloading
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  youtube-scene-test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout experimental implementation
        uses: actions/checkout@v4
        with:
          ref: experiment/anime-motion-kokoro
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install downloader and media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --upgrade 'yt-dlp[default]'
          if ! command -v deno >/dev/null; then
            curl -fsSL https://deno.land/install.sh | sh
            echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
          fi
      - name: Discover and extract official trailer footage
        env:
          QUERY: ${{ inputs.query }}
          SCRIPT: ${{ inputs.script }}
          URL: ${{ inputs.url }}
          START: ${{ inputs.start }}
          DURATION: ${{ inputs.duration }}
          SEARCH_ONLY: ${{ inputs.search_only }}
          AUTHORIZED_MP4_URL: ${{ inputs.authorized_mp4_url }}
          DIAGNOSE: ${{ inputs.diagnose }}
        run: |
          python -m py_compile experiments/test_youtube_anime_scene.py
          args=(--script "$SCRIPT" --start "$START" --duration "$DURATION")
          [[ -n "$QUERY" ]] && args+=(--query "$QUERY")
          [[ -n "$URL" ]] && args+=(--url "$URL")
          [[ "$SEARCH_ONLY" == "true" ]] && args+=(--search-only)
          [[ "$DIAGNOSE" == "true" ]] && args+=(--diagnose)
          [[ -n "$AUTHORIZED_MP4_URL" ]] && args+=(--authorized-mp4-url "$AUTHORIZED_MP4_URL")
          python experiments/test_youtube_anime_scene.py "${args[@]}"
      - name: Upload extracted anime scene and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-anime-scene-test
          path: |
            output/youtube_scene_test/report.json
            output/youtube_scene_test/anime_scene_clip.mp4
          if-no-files-found: warn
