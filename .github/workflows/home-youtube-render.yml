name: Bouriko Home YouTube to Hosted Render
on:
  workflow_dispatch:
    inputs:
      topic_index:
        description: "Script test topic index (0-5)"
        type: choice
        required: true
        default: "0"
        options: ["0", "1", "2", "3", "4", "5"]
permissions:
  contents: read
concurrency:
  group: bouriko-home-youtube-render
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install script dependencies
        run: python -m pip install -q requests
      - name: Generate one canonical script and scene plan
        env:
          BOURIKO_TEST_TOPIC_INDEX: ${{ inputs.topic_index }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/script.py
      - name: Upload exact story for both later jobs
        uses: actions/upload-artifact@v4
        with:
          name: bouriko-home-story
          path: output/story.json
          if-no-files-found: error
          retention-days: 5

  youtube_acquisition:
    needs: plan
    runs-on: [self-hosted, Windows, X64, bouriko-youtube]
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with:
          name: bouriko-home-story
          path: output
      - name: Validate home-runner prerequisites
        run: |
          python --version
          node --version
          ffmpeg -version | Select-Object -First 1
          ffprobe -version | Select-Object -First 1
      - name: Install acquisition tools
        run: |
          python -m pip install -q -U requests pillow google-genai 'yt-dlp[default]' bgutil-ytdlp-pot-provider
      - name: Acquire licensed YouTube footage and topic-specific visuals at home
        env:
          BOURIKO_HOME_YOUTUBE_ACQUISITION: "1"
        run: python pipeline/media.py
      - name: Verify all media streams and at least one real YouTube CC clip
        run: python tools/verify_home_media.py --mode create --min-youtube 1
      - name: Upload acquired assets and hash receipt for hosted renderer
        uses: actions/upload-artifact@v4
        with:
          name: bouriko-home-media
          path: output/
          if-no-files-found: error
          compression-level: 0
          retention-days: 5

  hosted_render:
    needs: [plan, youtube_acquisition]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - uses: actions/download-artifact@v4
        with:
          name: bouriko-home-media
          path: output
      - name: System video and narration packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Install render dependencies
        run: |
          python -m pip install -q requests google-api-python-client google-auth "kokoro>=0.9.4" soundfile numpy pillow google-genai 'yt-dlp[default]' bgutil-ytdlp-pot-provider
          python -m pip install -q "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl"
          python -m pip check
      - name: Verify transferred home-video hashes and playable streams
        run: python tools/verify_home_media.py --mode check --min-youtube 1
      - name: Validate narration and graphics plan
        run: python tools/test_visual_plan.py
      - name: Generate narration
        env:
          NIGHTFILES_VOICE: ${{ vars.NIGHTFILES_VOICE }}
        run: python pipeline/voice.py
      - name: Generate SFX
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/sfx.py
      - name: Prepare imported YouTube footage and voice for Remotion
        run: python pipeline/remotion_prepare.py
      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Render video
        working-directory: remotion
        run: npm run render
      - name: Verify finished MP4 and creative review manifest
        run: python pipeline/qa.py
      - name: Upload video and scene evidence (no publication)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bouriko-home-youtube-render
          path: |
            output/bouriko.mp4
            output/story.json
            output/media_manifest.json
            output/home_media_receipt.json
            output/creative_qa.json
          if-no-files-found: warn
          retention-days: 7
