name: Bouriko Media Quality Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-quality-smoke.yml'
      - 'pipeline/media.py'
      - 'tools/test_media_validation.py'
      - 'tools/traffic_light_auto_test.py'
      - 'tools/verify_home_media.py'
      - 'tools/test_home_media_handoff.py'
      - 'tools/dispatch_private_media.py'
      - 'tools/verify_private_handoff.py'
      - 'tools/test_private_dispatch.py'
      - '.github/workflows/home-youtube-render.yml'
  pull_request:
    paths:
      - 'pipeline/scene_library.py'
      - 'pipeline/frame_vision.py'
      - 'pipeline/media.py'
      - 'pipeline/visual_plan.py'
      - 'tools/test_scene_library.py'
      - 'tools/test_frame_vision.py'
      - 'tools/test_scene_evaluation.py'
      - 'pipeline/remotion_prepare.py'
      - 'tools/test_remotion_prepare.py'
      - 'tools/evaluate_scene_vision.py'
      - 'tools/windows/validate-scene-vision.ps1'
      - 'requirements-scene-vision.txt'
      - 'docs/YOUTUBE_SCENE_LIBRARY.md'
      - 'tools/verify_home_media.py'
      - 'pipeline/qa.py'
      - '.github/workflows/media-quality-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-media-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install ffprobe and lightweight test dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q requests pillow pyyaml
      - name: Validate Python syntax
        run: python -m compileall -q pipeline tools/test_media_validation.py tools/traffic_light_auto_test.py tools/test_home_media_handoff.py tools/verify_home_media.py tools/dispatch_private_media.py tools/verify_private_handoff.py tools/test_private_dispatch.py
      - name: Check media stream acceptance and stock search relevance
        run: python tools/test_media_validation.py
      - name: Test reusable YouTube scene selection (offline)
        run: python -m unittest discover -s tools -p 'test_scene_library.py' -v
      - name: Test visual frame gate with synthetic evidence and real FFmpeg frames
        run: python -m unittest discover -s tools -p 'test_frame_vision.py' -v
      - name: Test labeled local vision evaluation contract (no model download)
        run: python -m unittest discover -s tools -p 'test_scene_evaluation.py' -v
      - name: Test narration and video duration alignment
        run: python -m unittest discover -s tools -p 'test_remotion_prepare.py' -v
      - name: Parse Windows model validation PowerShell script
        shell: pwsh
        run: |
          $tokens = $null
          $errorsFound = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $env:GITHUB_WORKSPACE 'tools/windows/validate-scene-vision.ps1'),
            [ref]$tokens, [ref]$errorsFound) | Out-Null
          if ($errorsFound.Count -gt 0) {
            $errorsFound | ForEach-Object { Write-Host $_.ToString() }
            throw 'Windows model validation script failed to parse'
          }
          Write-Host 'PASS: Windows validation PowerShell syntax'

      - name: Check home-media artifact integrity and license gates
        run: python tools/test_home_media_handoff.py
      - name: Check cross-repository compressed story and provenance verification
        run: python tools/test_private_dispatch.py
      - name: Parse public dispatch and hosted-render workflow
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          file = Path('.github/workflows/home-youtube-render.yml')
          contents = file.read_text()
          workflow = yaml.load(contents, Loader=yaml.BaseLoader)
          assert list(workflow['jobs']) == ['plan', 'render']
          assert workflow['permissions']['contents'] == 'read'
          assert list(workflow['on']) == ['workflow_dispatch']
          assert 'runs-on: [self-hosted' not in contents
          assert 'repository: Venloud/van02utuberunner' in contents
          assert 'tools/dispatch_private_media.py' in contents
          assert 'tools/verify_private_handoff.py' in contents
          print('PASS: public Bouriko plans and renders hosted, private runner owns acquisition')
          PY
      - name: Verify supported Node runtime
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
