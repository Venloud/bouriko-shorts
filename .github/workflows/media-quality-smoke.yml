name: Bouriko Media Quality Smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/media-quality-smoke.yml'
      - 'pipeline/media.py'
      - 'tools/test_media_validation.py'
      - 'tools/traffic_light_auto_test.py'
      - 'tools/verify_home_media.py'
      - 'tools/test_home_media_handoff.py'
      - '.github/workflows/home-youtube-render.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-media-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Install ffprobe and lightweight test dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q requests pillow pyyaml
      - name: Validate Python syntax
        run: python -m compileall -q pipeline tools/test_media_validation.py tools/traffic_light_auto_test.py tools/test_home_media_handoff.py tools/verify_home_media.py
      - name: Check media stream acceptance and stock search relevance
        run: python tools/test_media_validation.py
      - name: Check home-media artifact integrity and license gates
        run: python tools/test_home_media_handoff.py
      - name: Parse isolated home-runner workflow and verify stage wiring
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          workflow = yaml.load(Path('.github/workflows/home-youtube-render.yml').read_text(), Loader=yaml.BaseLoader)
          jobs = workflow['jobs']
          assert list(jobs) == ['plan', 'youtube_acquisition', 'hosted_render']
          assert 'bouriko-youtube' in jobs['youtube_acquisition']['runs-on']
          assert jobs['hosted_render']['needs'] == ['plan', 'youtube_acquisition']
          assert workflow['permissions']['contents'] == 'read'
          assert list(workflow['on']) == ['workflow_dispatch']
          print('PASS: home acquisition -> hosted render workflow graph')
          PY
      - name: Verify supported Node runtime
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
