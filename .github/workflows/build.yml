name: Bouriko Build
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Fresh offline test"
        required: false
        type: boolean
      test:
        description: "Run traffic-light test"
        required: false
        type: boolean
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Python packages
        run: pip install -q requests google-api-python-client google-auth "kokoro>=0.9.4" soundfile numpy pillow "rembg[cpu]"
      - name: Write story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/script.py
      - name: Build cut-out pose library
        run: python pipeline/pose_library.py
      - name: Generate Bouriko and Rock Phone voices
        run: python pipeline/voice.py
      - name: Render first-video compositor
        run: python pipeline/render.py
      - name: QA gate
        run: python pipeline/qa.py
      - uses: actions/upload-artifact@v4
        with:
          name: bouriko-first-video
          path: |
            output/bouriko.mp4
            output/story.json
            output/word_timings.json
            output/pose_review.png
            assets/poses/*.png
            assets/poses/poses.json
