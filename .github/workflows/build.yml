name: Bouriko Build
on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Fresh build"
        required: false
        type: boolean
      test:
        description: "Run traffic-light test"
        required: false
        type: boolean
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: System packages
        run: sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
      - name: Syntax check all pipeline Python
        run: python -m compileall -q pipeline
      - name: Python packages
        run: pip install -q requests google-api-python-client google-auth "kokoro>=0.9.4" soundfile numpy pillow google-genai
      - name: Write story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/script.py
      - name: Download free photos and videos
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
        run: python pipeline/media.py
      - name: Generate narrator voice
        env:
          NIGHTFILES_VOICE: ${{ vars.NIGHTFILES_VOICE }}
        run: python pipeline/voice.py
      - name: Generate real stock SFX
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline/sfx.py
      - name: Prepare Remotion assets
        run: python pipeline/remotion_prepare.py
      - name: Install Remotion
        working-directory: remotion
        run: npm install --no-audit --no-fund
      - name: Render media-first Short
        working-directory: remotion
        run: npm run render
      - name: QA gate
        run: python pipeline/qa.py
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: bouriko-remotion-test
          path: |
            output/bouriko.mp4
            output/story.json
            output/word_timings.json
            output/media_manifest.json
